<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Soraのゲーム企画ポートフォリオ。『ルミアの冒険譚』の戦闘と火竜戦のレベル設計、制作ツールを紹介します。" />
    <meta property="og:title" content="Sora | Game Design Portfolio" />
    <meta property="og:description" content="Soraのゲーム企画ポートフォリオ。『ルミアの冒険譚』の戦闘と火竜戦のレベル設計、制作ツールを紹介します。" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+JP:wght@400;600;700&family=Noto+Serif+SC:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <script>
      // 選ばれた配色テーマを、描画の前に html へ反映する（ちらつき防止）
      try {
        var t = JSON.parse(localStorage.getItem('sora-theme') || '{}');
        if (/^[gcmt]\d{2}$/.test(t.light || '')) document.documentElement.dataset.light = t.light;
        if (/^[gcmt]\d{2}$/.test(t.dark || '')) document.documentElement.dataset.dark = t.dark;
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[var(--c-bg)] text-[var(--c-ink)] antialiased selection:bg-[var(--c-accent)] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
