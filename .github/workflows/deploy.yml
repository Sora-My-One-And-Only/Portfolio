name: Deploy Portfolio to GitHub Pages (.github.io)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
  # 毎日 3:00（日本時間）にプレイ履歴を取り直して再公開する
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Secrets が未設定・期限切れでも、コミット済みのデータでビルドを続ける
      - name: Sync play history (Steam / PlayStation)
        run: npm run sync:play
        continue-on-error: true
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}

      - name: Build static site for .github.io
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
